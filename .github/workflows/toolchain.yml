name: toolchain

# Full bootstrap from source: hours of CPU, so it only runs on demand. "all" ends with the disk
# image, which x86_64 boots in QEMU (tests/boot.py) and installs onto an empty disk
# (tests/install.py).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "bootstrap stage(s)"
        type: choice
        options: [toolchain, base, all]
        default: toolchain

permissions:
  contents: read

jobs:
  bootstrap:
    name: bootstrap ${{ matrix.arch }} (${{ inputs.stage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential bison flex texinfo gawk m4 \
            perl python3 zstd xz-utils libzstd-dev meson ninja-build cmake pkg-config qemu-user git curl \
            mtools qemu-system-x86 ovmf
      - name: user namespaces and KVM
        # the disk image is made without root (unshare -r); KVM makes the boot tests fast
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: recipes
        run: git clone -q --depth 1 https://github.com/vovawees/CleanLinux-Recipes.git build/recipes
      - name: source cache
        uses: actions/cache@v6
        with:
          path: build/cache/sources
          key: sources-${{ hashFiles('build/recipes/packages/*/recipe') }}
          restore-keys: sources-
      - name: bootstrap
        run: bootstrap/bootstrap.sh --arch ${{ matrix.arch }} --recipes build/recipes/packages ${{ inputs.stage }}
      - name: boot test
        if: inputs.stage == 'all' && matrix.arch == 'x86_64'
        run: python3 tests/boot.py build/x86_64/cleanlinux-x86_64-generic-x86_64.img --log build/x86_64/logs/boot.log
      - name: install test
        if: inputs.stage == 'all' && matrix.arch == 'x86_64'
        run: python3 tests/install.py build/x86_64/cleanlinux-x86_64-generic-x86_64.img
      - name: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: |
            build/${{ matrix.arch }}/logs
            build/${{ matrix.arch }}/*.log
      - name: rootfs
        if: success() && inputs.stage == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/*.tar.zst
      - name: disk image
        if: success() && inputs.stage == 'all'
        run: zstd -T0 -10 --sparse build/${{ matrix.arch }}/*.img
      - name: upload the disk image
        if: success() && inputs.stage == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: disk-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/*.img.zst
