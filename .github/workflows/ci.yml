name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar -xJ
          sudo install -m755 "shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck
        run: >
          shellcheck -x broom/broom broom/lib/*.sh broom/buildtypes/*.sh broom/hooks/*/*
          tests/*.sh bootstrap/*.sh profiles/*.profile profiles/devices/*.profile

  tests:
    name: tests (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends meson ninja-build cmake pkg-config zstd xz-utils
      - name: recipes
        run: git clone -q --depth 1 https://github.com/vovawees/CleanLinux-Recipes.git ../CleanLinux-Recipes
      - name: rolling release+++ test
        run: tests/rolling.sh
      - name: smoke test (real recipes)
        run: tests/smoke.sh ../CleanLinux-Recipes/packages

  tests-arm64:
    name: tests (aarch64)
    # free arm64 runners exist for public repositories only
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends meson ninja-build cmake pkg-config zstd xz-utils
      - name: recipes
        run: git clone -q --depth 1 https://github.com/vovawees/CleanLinux-Recipes.git ../CleanLinux-Recipes
      - name: rolling release+++ test
        run: tests/rolling.sh
      - name: smoke test (real recipes)
        run: tests/smoke.sh ../CleanLinux-Recipes/packages
