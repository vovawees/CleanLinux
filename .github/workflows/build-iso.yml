name: Build ISO

on:
  push:
    branches: [main]
    paths:
      - "profiles/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "profiles/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:
  release:
    types: [published]

env:
  PROFILE: profiles/cleanlinux

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git archiso squashfs-tools

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for SOURCE_DATE_EPOCH

      - name: Build ISO (${{ env.PROFILE }})
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh "$PROFILE"

      - name: Verify ISO exists
        run: |
          ls -lh out/*.iso
          test -s out/*.iso || { echo "ISO is missing"; exit 1; }

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanlinux-iso-x86_64
          path: out/*.iso
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Attach ISO to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" out/*.iso --clobber --repo "$GITHUB_REPOSITORY"
