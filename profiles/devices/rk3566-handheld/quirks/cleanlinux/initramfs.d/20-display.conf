# The screen in the initramfs: U-Boot leaves no framebuffer behind, so without these the
# passphrase prompt of an encrypted root would not show on the device. optional= modules ride
# along only when an initramfs is made anyway (they do not ask for one); coldplug loads those
# whose device is there.
optional=rockchipdrm phy-rockchip-inno-dsidphy pwm_bl spi-gpio
optional=panel-newvision-nv3051d panel-sitronix-st7701 panel-sitronix-st7703 panel-himax-hx8394 panel-magnachip-d53e6ea8966
