LABEL arch
TEXT HELP
Boot the Clean Linux install medium on BIOS.
It allows you to install Clean Linux or perform system maintenance.
ENDTEXT
MENU LABEL Clean Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% amdgpu.cik_support=0 radeon.cik_support=1 quiet loglevel=3 logo.nologo

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Clean Linux install medium on BIOS with speakup screen reader.
It allows you to install Clean Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Clean Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on amdgpu.cik_support=0 radeon.cik_support=1 quiet loglevel=3 logo.nologo
